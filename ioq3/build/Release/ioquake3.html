<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ioquake3 Emscripten demo</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(0, 0, 0); display:flex; align-items: center; justify-content: center; }
canvas { max-width: 100%; max-height: 100%; min-width: 100%; min-height: 100%; object-fit: contain; }

/* ---- touch controls (mobile only) ---- */
#touchui { position: fixed; inset: 0; z-index: 20; touch-action: none; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#touchui[hidden] { display: none; }
#tstick { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px;
  border: 2px solid rgba(255, 60, 40, .5); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,40,20,.10), rgba(0,0,0,.28));
  opacity: 0; transition: opacity .12s; pointer-events: none; }
#tthumb { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
  border-radius: 50%; border: 2px solid rgba(255, 90, 70, .85);
  background: radial-gradient(circle at 40% 35%, rgba(255,120,90,.55), rgba(180,20,10,.45)); }
.tbtn { position: absolute; border-radius: 50%; display: grid; place-items: center;
  font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .12em; color: #ffd9d2;
  border: 2px solid rgba(255, 70, 45, .55); background: rgba(30, 8, 5, .38);
  text-shadow: 0 0 8px rgba(255,60,30,.7); }
.tbtn:active, .tbtn.on { background: rgba(255, 50, 25, .45); border-color: #ff7b5a; color: #fff; }
#tfire { right: 26px; bottom: 30px; width: 96px; height: 96px; font-size: 14px; }
#tjump { right: 136px; bottom: 58px; width: 72px; height: 72px; }
#tweap { right: 40px; bottom: 140px; width: 64px; height: 64px; font-size: 11px; }

/* ---- loading screen ---- */
#q3load { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: #05060a; color: #dfe3e9;
  font: 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; }
#q3load[hidden] { display: none; }
#q3load .box { width: min(460px, 82vw); text-align: center; }
#q3load .ttl { color: #ff2a1a; letter-spacing: .34em; text-transform: uppercase; margin-bottom: 18px;
  text-shadow: 0 0 18px rgba(255,42,26,.45); }
#q3load .bar { height: 10px; border: 1px solid #4c545e; background: #0a0c10; overflow: hidden; }
#q3load .fill { height: 100%; width: 0; background: linear-gradient(90deg, #7e1602, #ff5a2b);
  box-shadow: 0 0 18px rgba(255,90,43,.6); transition: width .2s ease; }
#q3load .num { margin-top: 12px; color: #e7ebf1; }
#q3load .sub { margin-top: 6px; font-size: 11px; color: #7d8590; letter-spacing: .1em; }
</style>

<canvas id=canvas></canvas>

<div id=q3load>
  <div class=box>
    <div class=ttl>Loading Arena</div>
    <div class=bar><div class=fill id=q3load-fill></div></div>
    <div class=num id=q3load-num>Connecting…</div>
    <div class=sub id=q3load-sub>First load only — the game data is cached afterwards</div>
  </div>
</div>

<div id=touchui hidden>
  <div id=tstick><div id=tthumb></div></div>
  <div class=tbtn id=tfire>FIRE</div>
  <div class=tbtn id=tjump>JUMP</div>
  <div class=tbtn id=tweap>WPN</div>
</div>

<div id=q3events style="position:fixed;top:8px;right:8px;max-width:340px;max-height:45%;overflow-y:auto;background:rgba(0,0,0,.7);color:#7fff7f;font:11px monospace;padding:6px;z-index:10;pointer-events:none;white-space:pre-wrap;"></div>

<script>
// Score bridge: the engine calls Q3Bridge.onEvent with match_start / score / match_end.
// When embedded (e.g. by the lobby page), events are forwarded to the parent
// via postMessage and the on-page debug overlay is hidden.
// Loading screen. The engine needs a few hundred MB of game data before it can
// show anything, so without this the canvas is simply black for minutes and the
// game looks broken.
window.Q3Loading = (() => {
  const el = document.getElementById('q3load');
  const fill = document.getElementById('q3load-fill');
  const num = document.getElementById('q3load-num');
  const sub = document.getElementById('q3load-sub');
  const MB = (b) => (b / 1048576).toFixed(0);
  let total = 0, loaded = 0, started = 0;
  const post = (data) => { if (window.parent !== window) window.parent.postMessage({ source: 'q3', loading: data }, location.origin); };
  const paint = (file) => {
    const pct = total ? Math.min(100, (loaded / total) * 100) : 0;
    fill.style.width = `${pct}%`;
    num.textContent = total ? `${MB(loaded)} / ${MB(total)} MB — ${pct.toFixed(0)}%` : `${MB(loaded)} MB`;
    const secs = (performance.now() - started) / 1000;
    if (total && loaded && secs > 3) {
      const eta = Math.max(0, ((total - loaded) / (loaded / secs)) / 60);
      sub.textContent = eta > 1 ? `about ${eta.toFixed(0)} min left — cached after the first load`
                                : `almost there — cached after the first load`;
    }
    post({ loaded, total, pct, file });
  };
  return {
    begin(t) { total = t; loaded = 0; started = performance.now(); el.hidden = false; paint(); },
    advance(n, file) { loaded += n; paint(file); },
    done() { el.hidden = true; post({ loaded, total, pct: 100, done: true }); },
  };
})();

window.Q3_EVENTS = [];
const Q3_EMBEDDED = window.parent !== window;
if (Q3_EMBEDDED) document.getElementById('q3events').style.display = 'none';

// Touch controls. The engine takes keyboard/mouse only, so the on-screen pad
// synthesises those events: a movable analog stick drives WASD, dragging the
// right side feeds relative mouse motion (SDL is in relative mouse mode), and
// the buttons map to attack / jump / weapnext.
(() => {
  const forced = new URLSearchParams(location.search).get('touch');
  if (forced !== '1' && (forced === '0' || !(matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window))) return;
  const ui = document.getElementById('touchui');
  const stick = document.getElementById('tstick');
  const thumb = document.getElementById('tthumb');
  const canvas = document.getElementById('canvas');
  ui.hidden = false;

  const KEYS = {
    forward: ['KeyW', 'w', 87], back: ['KeyS', 's', 83],
    left: ['KeyA', 'a', 65], right: ['KeyD', 'd', 68],
    jump: ['Space', ' ', 32],
  };
  const held = {};
  const setKey = (name, on) => {
    if (!!held[name] === !!on) return;
    held[name] = on;
    const [code, key, keyCode] = KEYS[name];
    const type = on ? 'keydown' : 'keyup';
    for (const target of [canvas, document, window]) {
      target.dispatchEvent(new KeyboardEvent(type, {
        code, key, keyCode, which: keyCode, bubbles: true, cancelable: true,
      }));
    }
  };

  let mouseX = innerWidth / 2, mouseY = innerHeight / 2;
  const look = (dx, dy) => {
    mouseX += dx; mouseY += dy;
    canvas.dispatchEvent(new MouseEvent('mousemove', {
      clientX: mouseX, clientY: mouseY, movementX: dx, movementY: dy,
      bubbles: true, cancelable: true,
    }));
  };
  const mouseBtn = (down) => canvas.dispatchEvent(new MouseEvent(down ? 'mousedown' : 'mouseup', {
    button: 0, buttons: down ? 1 : 0, clientX: mouseX, clientY: mouseY,
    bubbles: true, cancelable: true,
  }));

  const RADIUS = 58, DEADZONE = 0.28, LOOK_SCALE = 1.4;
  let moveId = null, lookId = null, baseX = 0, baseY = 0, lastX = 0, lastY = 0;
  let tapX = 0, tapY = 0, tapAt = 0;
  const buttons = new Map(); // touch identifier -> element

  const applyStick = (dx, dy) => {
    const len = Math.hypot(dx, dy);
    const clamped = len > RADIUS ? RADIUS / len : 1;
    thumb.style.transform = `translate(${dx * clamped}px, ${dy * clamped}px)`;
    const nx = dx / RADIUS, ny = dy / RADIUS;
    const live = Math.hypot(nx, ny) > DEADZONE;
    setKey('forward', live && ny < -DEADZONE);
    setKey('back', live && ny > DEADZONE);
    setKey('left', live && nx < -DEADZONE);
    setKey('right', live && nx > DEADZONE);
  };
  const releaseStick = () => {
    moveId = null;
    stick.style.opacity = 0;
    thumb.style.transform = '';
    ['forward', 'back', 'left', 'right'].forEach((k) => setKey(k, false));
  };

  const pressButton = (el, on) => {
    el.classList.toggle('on', on);
    if (el.id === 'tfire') mouseBtn(on);
    else if (el.id === 'tjump') setKey('jump', on);
    else if (el.id === 'tweap' && on && window.Q3Console) window.Q3Console('weapnext');
  };

  ui.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const btn = el && el.closest && el.closest('.tbtn');
      if (btn) { buttons.set(t.identifier, btn); pressButton(btn, true); continue; }
      if (t.clientX < innerWidth * 0.45 && moveId === null) {
        moveId = t.identifier; baseX = t.clientX; baseY = t.clientY;
        stick.style.left = `${baseX}px`; stick.style.top = `${baseY}px`; stick.style.opacity = 1;
        applyStick(0, 0);
      } else if (lookId === null) {
        lookId = t.identifier; lastX = t.clientX; lastY = t.clientY;
        tapX = t.clientX; tapY = t.clientY; tapAt = performance.now();
      }
    }
  }, { passive: false });

  ui.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === moveId) applyStick(t.clientX - baseX, t.clientY - baseY);
      else if (t.identifier === lookId) {
        look((t.clientX - lastX) * LOOK_SCALE, (t.clientY - lastY) * LOOK_SCALE);
        lastX = t.clientX; lastY = t.clientY;
      }
    }
  }, { passive: false });

  const endTouch = (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (buttons.has(t.identifier)) { pressButton(buttons.get(t.identifier), false); buttons.delete(t.identifier); }
      else if (t.identifier === moveId) releaseStick();
      else if (t.identifier === lookId) {
        // a short tap that barely moved is a click, so in-game menus stay usable
        const quick = performance.now() - tapAt < 260;
        const still = Math.hypot(t.clientX - tapX, t.clientY - tapY) < 12;
        if (quick && still) { mouseX = t.clientX; mouseY = t.clientY; mouseBtn(true); setTimeout(() => mouseBtn(false), 40); }
        lookId = null;
      }
    }
  };
  ui.addEventListener('touchend', endTouch, { passive: false });
  ui.addEventListener('touchcancel', endTouch, { passive: false });
})();
window.Q3Bridge = {
  onEvent(e) {
    window.Q3_EVENTS.push(e);
    if (Q3_EMBEDDED) {
      window.parent.postMessage({ source: 'q3', event: e }, window.location.origin);
      return;
    }
    console.log('[q3event]', JSON.stringify(e));
    const el = document.getElementById('q3events');
    if (el) {
      el.textContent += `${e.type} score=${e.score} rank=${e.rank} deaths=${e.deaths} map=${e.map}\n`;
      el.scrollTop = el.scrollHeight;
    }
  }
};
</script>

<script type=module>
// These strings are set in the generated HTML file in the build directory.
const CLIENT_NAME = 'ioquake3';
const BASEGAME = 'baseq3';
const EMSCRIPTEN_PRELOAD_FILE = 'OFF' === 'ON';

// Path or URL containing the client engine .js, .wasm, and possibly .data.
let enginePath = './';
// Path or URL containing fs_game directories.
let dataPath = './';
// Path or URL for config file that specifies the files to load for each fs_game.
let configFilename = `./${CLIENT_NAME}-config.json`;

if (window.location.protocol === 'file:') throw new Error(`Unfortunately browser security restrictions prevent loading wasm from a file: URL. This file must be loaded from a web server. The easiest way to do this is probably to use Python\'s built-in web server by running \`python3 -m http.server\` in the top level source directory and then navigate to http://localhost:8000/build/debug-emscripten-wasm32/${CLIENT_NAME}.html`);

// First set up the command line arguments and the Emscripten filesystem.
const urlParams = new URLSearchParams(window.location.search);
const com_basegame = urlParams.get('com_basegame') || BASEGAME;
const fs_basegame = urlParams.get('fs_basegame') || '';
const fs_game = urlParams.get('fs_game') || '';
// r_mode -2 means "desktop resolution", which Emscripten answers from
// screen.width/height — and on phones those report the physical *portrait*
// size and never swap when the device rotates, so a landscape phone rendered a
// tall portrait framebuffer. Size the renderer from the window we actually
// occupy instead.
const viewW = Math.max(320, Math.round(window.innerWidth));
const viewH = Math.max(240, Math.round(window.innerHeight));
let generatedArguments = `
    +set sv_pure 0
    +set net_enabled 0
    +set r_mode -1
    +set r_customwidth ${viewW}
    +set r_customheight ${viewH}
    +set r_fullscreen 0
    +set cl_voip 0
    +set s_alCapture 0
    +set com_basegame "${com_basegame}"
    +set fs_basegame "${fs_basegame}"
    +set fs_game "${fs_game}"
`;
// Note that unfortunately "+" needs to be encoded as "%2b" in URL query strings or it will be stripped by the browser.
const queryArgs = urlParams.get('args');
if (queryArgs) generatedArguments += ` ${queryArgs} `;

const dataURL = new URL(dataPath, location.origin + location.pathname);

const configPromise = EMSCRIPTEN_PRELOAD_FILE ? Promise.resolve({[BASEGAME]: {files: []}})
  : fetch(configFilename).then(r => r.ok ? r.json() : { /* empty config */ });

const ioquake3 = (await import(enginePath + `ioquake3.js`)).default;
const modulePromise = ioquake3({
    canvas: canvas,
    arguments: generatedArguments.trim().split(/\s+/),
    locateFile: (file) => enginePath + file,
    preRun: [async (module) => {
        module.addRunDependency('setup-ioq3-filesystem');
        try {
            const config = await configPromise;
            const gamedirs = [com_basegame,fs_basegame,fs_game];
            for (let g = 0; g < gamedirs.length; g++) {
                const gamedir = gamedirs[g];
                if (gamedir === '') {
                    continue;
                }
                if (config[gamedir] === null
                 || config[gamedir].files === null) {
                    console.warn(`Game directory '${gamedir}' cannot be used. It must have files listed in ${configFilename}.`);
                    continue;
                }
                const files = config[gamedir].files;
                // Ask for sizes up front so the loader can show real progress.
                const sizes = await Promise.all(files.map(f =>
                    fetch(new URL(f.src, dataURL), { method: 'HEAD' })
                        .then(r => +r.headers.get('content-length') || 0).catch(() => 0)));
                Q3Loading.begin(sizes.reduce((a, b) => a + b, 0));

                // Sequential, streamed: fetching all of these at once buffers
                // every file in memory simultaneously, which is a few hundred
                // megabytes of peak usage and enough to sink a phone.
                for (let i = 0; i < files.length; i++) {
                    const response = await fetch(new URL(files[i].src, dataURL));
                    if (!response.ok) continue;
                    const name = files[i].src.match(/[^/]+$/)[0];
                    const dir = files[i].dst;
                    module.FS.mkdirTree(dir);

                    const expected = sizes[i];
                    if (!response.body) {                       // no streams: fall back
                        const buf = await response.arrayBuffer();
                        module.FS.writeFile(`${dir}/${name}`, new Uint8Array(buf));
                        Q3Loading.advance(expected || buf.byteLength, name);
                        continue;
                    }
                    const reader = response.body.getReader();
                    let chunks = [], received = 0;
                    for (;;) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.length;
                        Q3Loading.advance(value.length, name);
                    }
                    const data = new Uint8Array(received);
                    let offset = 0;
                    for (const c of chunks) { data.set(c, offset); offset += c.length; }
                    chunks = null;                              // release before the FS copy
                    module.FS.writeFile(`${dir}/${name}`, data);
                    if (expected && received !== expected) Q3Loading.advance(expected - received, name);
                }
            }
        } finally {
            Q3Loading.done();   // must clear even if a fetch failed, or the
                                // player is left staring at a stuck bar
            module.removeRunDependency('setup-ioq3-filesystem');
        }
    }],
});

window.Q3Module = await modulePromise;
// Queue a console command from the page, e.g. Q3Console('addbot random 1').
window.Q3Console = (cmd) =>
    window.Q3Module.ccall('Sys_QueueConsoleCommand', null, ['string'], [cmd]);

// Rotating the device changes the window shape but not the renderer's, so
// rebuild it at the new size. Debounced, because iOS fires resize repeatedly
// through the rotation animation.
(() => {
    let lastW = viewW, lastH = viewH, timer = null;
    addEventListener('resize', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
            const w = Math.max(320, Math.round(window.innerWidth));
            const h = Math.max(240, Math.round(window.innerHeight));
            if (Math.abs(w - lastW) < 24 && Math.abs(h - lastH) < 24) return;
            lastW = w; lastH = h;
            try {
                window.Q3Console(`r_customwidth ${w}`);
                window.Q3Console(`r_customheight ${h}`);
                window.Q3Console('vid_restart');
            } catch (e) { /* engine not up yet */ }
        }, 350);
    });
})();
</script>
